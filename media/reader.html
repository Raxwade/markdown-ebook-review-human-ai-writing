<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<!--
  CSP is generated by preview.ts; {{cspSource}} and {{nonce}} are substituted there.
  blob: in style-src is not optional: foliate-js injects the book's stylesheets as
  blob: URLs, and without it the book renders completely unstyled with no error
  thrown — only a console message. Verified in M0 (spec §7.1).
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'nonce-{{nonce}}' {{cspSource}};
  style-src 'unsafe-inline' {{cspSource}} blob:;
  img-src blob: data: {{cspSource}};
  font-src {{cspSource}};
  frame-src blob: data:;
  child-src blob:;
  worker-src blob:;
  connect-src blob: {{cspSource}};
"/>
<title>Markdown Ebook Review</title>
<link rel="stylesheet" href="{{cssUri}}"/>
</head>
<body>
<div id="toolbar">
  <button id="history-back" title="Go back (Alt+Left)" data-i18n-title="toolbar.historyBack" disabled>↶</button>
  <button id="history-forward" title="Go forward (Alt+Right)" data-i18n-title="toolbar.historyForward" disabled>↷</button>
  <button id="prev" title="Previous page (Left / PageUp)" data-i18n-title="toolbar.previousPage">‹</button>
  <button id="next" title="Next page (Right / PageDown / Space)" data-i18n-title="toolbar.nextPage">›</button>
  <select id="toc" title="Jump to chapter" data-i18n-title="toolbar.chapter"></select>
  <input id="progress-scrubber" type="range" min="0" max="100" step="0.1" value="0" title="Scrub reading progress" aria-label="Reading progress" data-i18n-title="toolbar.scrubProgress" data-i18n-aria-label="toolbar.readingProgress"/>
  <span id="progress"></span>
  <span id="spacer"></span>
  <button id="appearance-toggle" title="Reading appearance" data-i18n-title="toolbar.appearance">Aa</button>
  <button id="search-toggle" title="Search book (Ctrl+F)" data-i18n-title="toolbar.search">⌕</button>
  <button id="bookmark-current" title="Add bookmark at current location (Ctrl+D)" data-i18n-title="bookmark.addCurrent">☆</button>
  <button id="bookmarks-toggle" title="Bookmarks" data-i18n-title="toolbar.bookmarks">🔖 <span id="bookmarks-count"></span></button>
  <button id="notes-toggle" title="Notes" data-i18n-title="toolbar.notes">✎ <span id="notes-count"></span></button>
  <select id="device" title="Device viewport" data-i18n-title="toolbar.device"></select>
  <button id="rotate" title="Swap portrait and landscape" data-i18n-title="toolbar.rotate">⟳</button>
  <span id="size"></span>
  <span id="status"></span>
</div>

<section id="appearance-panel" hidden aria-label="Reading appearance" data-i18n-aria-label="appearance.title">
  <header>
    <strong data-i18n="appearance.title">Reading appearance</strong>
    <button id="appearance-close" title="Close" data-i18n-title="common.close">✕</button>
  </header>
  <div class="appearance-grid">
    <label for="appearance-font-size"><span data-i18n="appearance.fontSize">Font size</span> <output id="appearance-font-size-value">100%</output></label>
    <input id="appearance-font-size" type="range" min="80" max="200" step="10"/>

    <label for="appearance-font-family" data-i18n="appearance.font">Font</label>
    <select id="appearance-font-family">
      <option value="publisher" data-i18n="appearance.originalBook">Original book</option>
      <option value="serif" data-i18n="appearance.serif">Serif</option>
      <option value="sans-serif" data-i18n="appearance.sansSerif">Sans serif</option>
      <option value="monospace" data-i18n="appearance.monospace">Monospace</option>
    </select>

    <label class="appearance-check" for="appearance-bold" data-i18n="appearance.bold">Bold text</label>
    <input id="appearance-bold" type="checkbox"/>

    <label for="appearance-line-height"><span data-i18n="appearance.lineHeight">Line height</span> <output id="appearance-line-height-value">1.5</output></label>
    <input id="appearance-line-height" type="range" min="1.2" max="2" step="0.1"/>

    <label for="appearance-character-spacing"><span data-i18n="appearance.characterSpacing">Character spacing</span> <output id="appearance-character-spacing-value">0em</output></label>
    <input id="appearance-character-spacing" type="range" min="-0.02" max="0.12" step="0.01"/>

    <label for="appearance-word-spacing"><span data-i18n="appearance.wordSpacing">Word spacing</span> <output id="appearance-word-spacing-value">0em</output></label>
    <input id="appearance-word-spacing" type="range" min="0" max="0.3" step="0.01"/>

    <label for="appearance-page-margin"><span data-i18n="appearance.pageMargins">Page margins</span> <output id="appearance-page-margin-value">48px</output></label>
    <input id="appearance-page-margin" type="range" min="16" max="96" step="4"/>

    <label for="appearance-text-align" data-i18n="appearance.alignment">Alignment</label>
    <select id="appearance-text-align">
      <option value="publisher" data-i18n="appearance.originalBook">Original book</option>
      <option value="left" data-i18n="appearance.leftAligned">Left aligned</option>
      <option value="justify" data-i18n="appearance.justified">Justified</option>
    </select>

    <label for="appearance-columns" data-i18n="appearance.columns">Columns</label>
    <select id="appearance-columns">
      <option value="auto" data-i18n="appearance.automatic">Automatic</option>
      <option value="single" data-i18n="appearance.oneColumn">One column</option>
      <option value="double" data-i18n="appearance.twoColumns">Two columns</option>
    </select>

    <label for="appearance-reading-mode" data-i18n="appearance.readingMode">Reading mode</label>
    <select id="appearance-reading-mode">
      <option value="paginated" data-i18n="appearance.paginated">Paginated</option>
      <option value="scrolled" data-i18n="appearance.verticalScrolling">Vertical scrolling</option>
    </select>

    <label for="appearance-theme" data-i18n="appearance.pageTheme">Page theme</label>
    <select id="appearance-theme">
      <option value="publisher" data-i18n="appearance.originalBook">Original book</option>
      <option value="system" data-i18n="appearance.system">System</option>
      <option value="light" data-i18n="appearance.light">Light</option>
      <option value="paper" data-i18n="appearance.paper">Paper</option>
      <option value="sepia" data-i18n="appearance.sepia">Sepia</option>
      <option value="gray" data-i18n="appearance.gray">Gray</option>
      <option value="dark" data-i18n="appearance.dark">Dark</option>
    </select>
  </div>
  <footer><button id="appearance-reset" data-i18n="appearance.reset">Reset reader overrides</button></footer>
</section>

<div id="body">
  <div id="stage">
    <div id="frame-outer">
      <!-- An iframe, not a div, and that is the whole point of it. foliate sizes
           its columns from getBoundingClientRect(), which is the *transformed*
           size, so a frame scaled to fit the panel paginated the book at
           whatever it looked like instead of at the device size it declares.
           Inside an iframe that rect is relative to the iframe's own viewport
           and the transform cannot reach it. Filled in by reader.js (§6.1). -->
      <iframe id="frame" title="Device viewport" data-i18n-title="toolbar.device"></iframe>
    </div>

    <!-- Follows a text selection or clicked image inside the device frame.
         Every choice opens the editor; saving an empty note keeps a bare mark. -->
    <div id="mark-bar" hidden>
      <button class="swatch" data-color="yellow" title="Yellow" data-i18n-title="color.yellow"></button>
      <button class="swatch" data-color="green" title="Green" data-i18n-title="color.green"></button>
      <button class="swatch" data-color="blue" title="Blue" data-i18n-title="color.blue"></button>
      <button class="swatch" data-color="pink" title="Pink" data-i18n-title="color.pink"></button>
      <button class="swatch" data-color="purple" title="Purple" data-i18n-title="color.purple"></button>
      <button id="mark-note" title="Highlight and add a note" data-i18n-title="notes.highlightAndNote">✎ <span data-i18n="notes.note">Note</span></button>
    </div>
  </div>

  <aside id="reader-drawer" hidden>
    <header class="drawer-header">
      <nav aria-label="Reader tools" data-i18n-aria-label="drawer.tools">
        <button data-drawer-tab="search" data-i18n="drawer.search">Search</button>
        <button data-drawer-tab="bookmarks" data-i18n="drawer.bookmarks">Bookmarks</button>
        <button data-drawer-tab="notes" data-i18n="drawer.notes">Notes</button>
      </nav>
      <button id="drawer-close" title="Close" data-i18n-title="common.close">✕</button>
    </header>

    <section id="search-panel" class="drawer-panel" hidden>
      <form id="search-form">
        <input id="search-input" type="search" placeholder="Search the whole book…" autocomplete="off" aria-label="Search the whole book" data-i18n-placeholder="search.placeholder" data-i18n-aria-label="search.label"/>
        <button id="search-cancel" type="button" title="Cancel and clear search" data-i18n-title="search.cancel">✕</button>
      </form>
      <div class="drawer-subheader">
        <span id="search-summary" data-i18n="search.prompt">Enter text to search the whole book</span>
        <span class="grow"></span>
        <button id="search-prev" title="Previous result" data-i18n-title="search.previous" disabled>↑</button>
        <button id="search-next" title="Next result" data-i18n-title="search.next" disabled>↓</button>
      </div>
      <progress id="search-progress" max="1" value="0" hidden></progress>
      <div id="search-results" class="drawer-list"></div>
    </section>

    <section id="bookmarks-panel" class="drawer-panel" hidden>
      <div class="drawer-subheader">
        <strong data-i18n="drawer.bookmarks">Bookmarks</strong>
        <span id="bookmarks-summary"></span>
      </div>
      <div id="bookmarks-list" class="drawer-list"></div>
    </section>

    <section id="notes-panel" class="drawer-panel" hidden>
      <div class="drawer-subheader">
        <strong data-i18n="drawer.notes">Notes</strong>
        <span id="notes-summary"></span>
        <span class="grow"></span>
      </div>
      <button id="close-stale-notes" hidden data-i18n="notes.closeStale">Archive / discard stale…</button>
      <div id="notes-list" class="drawer-list"></div>
      <footer id="notes-path"></footer>
    </section>
  </aside>
</div>

<!-- Editing a comment. Kept out of the device frame so it never affects layout. -->
<div id="note-editor" hidden>
  <div class="sheet">
    <div id="note-quote"></div>
    <div id="note-colors"></div>
    <textarea id="note-text" rows="4" placeholder="Write a note for yourself or an AI…" data-i18n-placeholder="notes.placeholder"></textarea>
    <div class="row">
      <button id="note-delete" data-i18n="notes.deleteHighlight">Delete highlight</button>
      <span class="grow"></span>
      <button id="note-cancel" data-i18n="common.cancel">Cancel</button>
      <button id="note-save" class="primary" data-i18n="common.save">Save</button>
    </div>
  </div>
</div>

<pre id="error"></pre>
<script type="module" nonce="{{nonce}}" src="{{jsUri}}"></script>
</body>
</html>
