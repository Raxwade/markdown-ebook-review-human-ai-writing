<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Reader experience integration</title>
<style>
html, body { margin: 0; height: 100%; font: 13px/1.5 ui-monospace, monospace; }
#preview { width: 100%; height: calc(100% - 130px); border: 0; }
#result { height: 110px; overflow: auto; margin: 0; padding: 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<iframe id="preview" src="/preview.html"></iframe>
<pre id="result">RUNNING</pre>
<script>
const frame = document.getElementById('preview')
const result = document.getElementById('result')
const checks = []
const wait = ms => new Promise(resolve => setTimeout(resolve, ms))
const until = async (predicate, timeout = 12000) => {
  const start = performance.now()
  while (performance.now() - start < timeout) {
    const value = predicate()
    if (value) return value
    await wait(40)
  }
  throw new Error('timed out waiting for browser state')
}
const check = (name, pass, detail = '') => checks.push({ name, pass: Boolean(pass), detail: String(detail) })
const post = message => frame.contentWindow.postMessage(message, '*')

async function run() {
  const page = await until(() => frame.contentDocument?.getElementById('toolbar') && frame.contentWindow)
  await until(() => page.__toExtension?.some(message => message.type === 'ready'))
  const bytes = new Uint8Array(await (await fetch('/reader-experience.epub')).arrayBuffer())
  const bookId = 'a'.repeat(64)
  const config = locale => post({
    type: 'config', locale, device: 'iphone', customWidth: 393, customHeight: 852,
  })
  config('en-US')
  await wait(30)
  const appearancePanel = page.document.getElementById('appearance-panel')
  check('English is the default reader language',
    appearancePanel.querySelector('header strong').textContent === 'Reading appearance')
  check('English appearance panel contains no Chinese UI text',
    !/\p{Script=Han}/u.test(appearancePanel.textContent))
  config('zh-TW')
  await wait(30)
  check('supported VS Code locale translates the reader',
    appearancePanel.querySelector('header strong').textContent === '閱讀外觀')
  config('fr')
  await wait(30)
  check('unsupported locale falls back to English',
    appearancePanel.querySelector('header strong').textContent === 'Reading appearance')
  post({ type: 'reader:profile', profile: {
    version: 1, fontSize: 100, fontFamily: 'publisher', bold: false,
    lineHeight: 1.5, characterSpacing: 0, wordSpacing: 0, pageMargin: 48,
    textAlign: 'publisher', columns: 'auto', readingMode: 'paginated', theme: 'publisher',
  }, styles: '' })
  post({ type: 'reader:book-state', bookId, state: {
    version: 1, cfi: null, fraction: 0, bookmarks: [], lastUsed: Date.now(),
  } })
  post({ type: 'book', bookId, bytes, keepPosition: false, chapterStartLines: [] })

  const deviceFrame = page.document.getElementById('frame')
  const view = await until(() => deviceFrame.contentDocument?.getElementById('view'))
  await until(() => view.lastLocation?.cfi && view.renderer?.getContents?.()[0]?.doc)
  const bookIdentity = view.book
  const rendererIdentity = view.renderer
  const dimensions = [deviceFrame.contentWindow.innerWidth, deviceFrame.contentWindow.innerHeight]

  // All controls serialize one complete profile; the host tests cover
  // normalization/echo, while this proves no explicit apply button is needed.
  const fontControl = page.document.getElementById('appearance-font-size')
  fontControl.value = '120'
  fontControl.dispatchEvent(new page.Event('input', { bubbles: true }))
  await wait(30)
  const profileSave = [...page.__toExtension].reverse()
    .find(message => message.type === 'reader:profile-save')
  check('appearance control saves on input', profileSave?.profile?.fontSize === 120)

  page.document.getElementById('bookmarks-toggle').click()
  await wait(50)
  const drawerPosition = page.getComputedStyle(page.document.getElementById('reader-drawer')).position
  check('drawer adapts to panel width', page.innerWidth <= 700
    ? drawerPosition === 'absolute' : drawerPosition === 'static',
    `${page.innerWidth}px / ${drawerPosition}`)
  check('drawer never changes declared device viewport',
    dimensions[0] === deviceFrame.contentWindow.innerWidth
      && dimensions[1] === deviceFrame.contentWindow.innerHeight)
  page.document.getElementById('bookmarks-toggle').click()

  await view.goToFraction(0.35)
  await wait(180)
  const locationBefore = view.lastLocation.cfi
  const restoreTargets = []
  const resolveNavigation = view.resolveNavigation.bind(view)
  view.resolveNavigation = target => {
    restoreTargets.push(target)
    return resolveNavigation(target)
  }

  // Draw a real note before changing layout; its overlayer child must survive.
  const content = await until(() => view.renderer.getContents()
    .find(item => item.doc.querySelector('table') && item.doc.querySelector('img')), 6000)
  const narrowTable = content.doc.querySelector('table')
  const narrowTableStyle = narrowTable
    ? content.doc.defaultView.getComputedStyle(narrowTable) : null
  const narrowCellStyle = narrowTable
    ? content.doc.defaultView.getComputedStyle(narrowTable.querySelector('th, td')) : null
  const overflowingCells = narrowTable
    ? [...narrowTable.querySelectorAll('th, td')]
      .filter(cell => cell.scrollWidth > cell.clientWidth + 1) : []
  const chapterStyle = content.doc.defaultView.getComputedStyle(content.doc.documentElement)
  const columnWidth = parseFloat(chapterStyle.columnWidth)
  check('phone table permits long cell values to wrap',
    narrowCellStyle?.overflowWrap === 'anywhere', narrowCellStyle?.overflowWrap)
  check('table retains automatic column proportions',
    narrowTableStyle?.tableLayout === 'auto', narrowTableStyle?.tableLayout)
  check('phone table stays inside the declared viewport without cell overflow',
    narrowTable && Number.isFinite(columnWidth)
      && narrowTable.clientWidth <= columnWidth + 1
      && narrowTable.scrollWidth <= narrowTable.clientWidth + 1
      && overflowingCells.length === 0,
    `${overflowingCells.length} overflowing cells; table ${narrowTable?.clientWidth}/${columnWidth}`)
  check('GFM task list reaches the real reader',
    content.doc.querySelector('.task-list-marker[role="checkbox"][aria-checked="true"]')?.textContent === '☒')
  check('GFM single-tilde strike reaches the real reader',
    content.doc.querySelector('del')?.textContent === 'Grammar reviewed')
  check('GFM extended autolink reaches the real reader',
    content.doc.querySelector('a[href="http://www.example.com"]')?.textContent === 'www.example.com')
  const textNode = [...content.doc.querySelectorAll('[data-md-line]')]
    .map(node => node.firstChild).find(node => node?.nodeType === 3 && node.textContent.trim().length > 10)
  if (textNode) {
    const range = content.doc.createRange()
    range.setStart(textNode, 0); range.setEnd(textNode, Math.min(8, textNode.length))
    const selection = content.doc.defaultView.getSelection()
    selection.removeAllRanges(); selection.addRange(range)
    content.doc.dispatchEvent(new content.doc.defaultView.MouseEvent('mouseup', { bubbles: true }))
    page.document.querySelector('#mark-bar .swatch[data-color="yellow"]').click()
    check('colour choice opens note editor', !page.document.getElementById('note-editor').hidden)
    page.document.querySelector('#note-cancel').click()
    await wait(250)
  }

  const previewImage = content.doc.querySelector('img[data-md-image-src]')
  if (previewImage) {
    previewImage.dispatchEvent(new content.doc.defaultView.MouseEvent('mouseup', { bubbles: true }))
    page.document.querySelector('#mark-bar .swatch[data-color="purple"]').click()
    const editor = page.document.getElementById('note-editor')
    check('image click opens note editor', !editor.hidden)
    page.document.getElementById('note-text').value = 'Review this image.'
    page.document.getElementById('note-save').click()
    await wait(250)
    const savedImage = [...page.__toExtension].reverse()
      .find(message => message.type === 'notes:save'
        && message.notes?.some(note => note.target?.type === 'image'))
    check('image note preserves Markdown target',
      savedImage?.notes?.some(note => note.target?.src === 'evidence/notes-highlight.png'))
  } else {
    check('image click opens note editor', false, 'fixture image missing')
    check('image note preserves Markdown target', false, 'fixture image missing')
  }

  // Simulate an AI edit that kept the quote on the host-reported line but
  // changed everything before it. Persisted columns deliberately point at the
  // first table cell; the highlight must be rebuilt around the quote instead.
  post({ type: 'notes', warnings: [], path: 'fixture.notes.json', notes: [] })
  await wait(250)
  const table = content.doc.querySelector('table[data-md-line]')
  const targetCell = table?.querySelector('tbody tr td:last-child')
  if (table && targetCell) {
    const line = Number(table.getAttribute('data-md-line')) + 2
    const quote = targetCell.textContent.trim()
    post({ type: 'notes', warnings: [], path: 'fixture.notes.json', notes: [{
      id: 'shifted-columns', color: 'yellow', chapter: view.lastLocation?.tocItem?.label ?? '',
      range: { startLine: line, startCol: 0, endLine: line, endCol: 6 },
      quote, note: '', created: new Date().toISOString(), status: 'moved', line,
    }] })
    await wait(300)
    const overlayRect = content.overlayer?.element.querySelector('g rect')
    const targetRect = targetCell.getBoundingClientRect()
    const x = Number(overlayRect?.getAttribute('x'))
    const y = Number(overlayRect?.getAttribute('y'))
    check('revised note ignores stale columns and highlights its quote',
      Number.isFinite(x) && Number.isFinite(y)
        && x >= targetRect.left - 1 && x < targetRect.right
        && y >= targetRect.top - 1 && y < targetRect.bottom,
      `overlay ${x},${y}; target ${targetRect.left},${targetRect.top}`)
  } else {
    check('revised note ignores stale columns and highlights its quote', false, 'fixture table missing')
  }
  const marksBefore = view.renderer.getContents()[0].overlayer?.element.children.length ?? 0
  check('annotation fixture drawn', marksBefore > 0, marksBefore)
  const outgoingBooksBefore = page.__toExtension.filter(message => message.type === 'book').length

  const profile = {
    version: 1, fontSize: 140, fontFamily: 'serif', bold: true,
    lineHeight: 1.9, characterSpacing: 0.07, wordSpacing: 0.2, pageMargin: 64,
    textAlign: 'justify', columns: 'single', readingMode: 'paginated', theme: 'sepia',
  }
  const styles = [
    'html { font-size: 140% !important; }',
    'html, body, body * { font-family: ui-serif, Georgia, "Times New Roman", serif !important; }',
    'body, p, li, blockquote, dd, dt, td, th { font-weight: 600 !important; }',
    'body, p, li, blockquote, dd, dt, td, th { line-height: 1.9 !important; }',
    'body { letter-spacing: 0.07em !important; }',
    'body { word-spacing: 0.2em !important; }',
    'body, p, li, blockquote, dd, dt { text-align: justify !important; }',
    ':root { color-scheme: light; --theme-bg-color: #f4ecd8; }',
    'html, body { background-color: #f4ecd8 !important; color: #493b2a !important; }',
  ].join('\n')
  post({ type: 'reader:profile', requestId: 1, profile, styles })
  await wait(700)

  const styled = view.renderer.getContents()[0]
  const bodyStyle = styled.doc.defaultView.getComputedStyle(styled.doc.body)
  const paragraph = styled.doc.querySelector('p, li, blockquote') ?? styled.doc.body
  const paraStyle = styled.doc.defaultView.getComputedStyle(paragraph)
  check('book identity unchanged', view.book === bookIdentity)
  check('renderer identity unchanged', view.renderer === rendererIdentity)
  check('font size applied', parseFloat(bodyStyle.fontSize) > 20, bodyStyle.fontSize)
  check('font family applied', bodyStyle.fontFamily.includes('ui-serif'), bodyStyle.fontFamily)
  check('bold text applied', Number(paraStyle.fontWeight) >= 600, paraStyle.fontWeight)
  check('line height applied', parseFloat(paraStyle.lineHeight) > 35, paraStyle.lineHeight)
  check('character spacing applied', parseFloat(bodyStyle.letterSpacing) > 1, bodyStyle.letterSpacing)
  check('word spacing applied', parseFloat(bodyStyle.wordSpacing) > 3, bodyStyle.wordSpacing)
  check('alignment applied', paraStyle.textAlign === 'justify', paraStyle.textAlign)
  check('theme background applied', bodyStyle.backgroundColor === 'rgb(244, 236, 216)', bodyStyle.backgroundColor)
  check('theme foreground applied', bodyStyle.color === 'rgb(73, 59, 42)', bodyStyle.color)
  check('margin attribute applied', view.renderer.getAttribute('margin') === '64px', view.renderer.getAttribute('margin'))
  check('single column applied', view.renderer.getAttribute('max-column-count') === '1')
  check('layout navigates back to captured CFI', restoreTargets.includes(locationBefore),
    `${locationBefore} | ${restoreTargets.join(' ; ')}`)
  check('device viewport unchanged', dimensions[0] === deviceFrame.contentWindow.innerWidth
    && dimensions[1] === deviceFrame.contentWindow.innerHeight, dimensions.join('x'))
  check('annotation survives appearance',
    (view.renderer.getContents()[0].overlayer?.element.children.length ?? 0) >= marksBefore)
  check('appearance posts no book request',
    page.__toExtension.filter(message => message.type === 'book').length === outgoingBooksBefore)

  post({ type: 'reader:profile', requestId: 2,
    profile: { ...profile, columns: 'double', readingMode: 'scrolled' }, styles })
  try {
    await until(() => view.renderer.getAttribute('flow') === 'scrolled'
      && view.renderer.getAttribute('max-column-count') === '2', 6000)
  } catch { /* assertions below carry the actual attributes */ }
  check('double columns includes portrait', view.renderer.getAttribute('max-column-count') === '2'
    && view.renderer.getAttribute('max-column-count-portrait') === '2',
    `${view.renderer.getAttribute('max-column-count')} / ${view.renderer.getAttribute('max-column-count-portrait')}`)
  check('vertical scrolling applied', view.renderer.getAttribute('flow') === 'scrolled',
    view.renderer.getAttribute('flow'))
  check('scroll mode preserves renderer', view.renderer === rendererIdentity)

  // Both scripts use Foliate's whole-book matcher. Then a broad in-flight
  // query is superseded to prove stale groups/highlights cannot leak back in.
  const search = page.document.getElementById('search-input')
  search.value = 'Latin needle 4-7'
  search.dispatchEvent(new page.Event('input', { bubbles: true }))
  await until(() => page.document.getElementById('search-summary').textContent === '1 result', 12000)
  check('Latin whole-book search', page.document.querySelectorAll('.search-result').length === 1)

  search.value = 'Latin needle'
  search.dispatchEvent(new page.Event('input', { bubbles: true }))
  await wait(190)
  search.value = 'CJK搜尋詞-6-4'
  search.dispatchEvent(new page.Event('input', { bubbles: true }))
  await until(() => page.document.getElementById('search-summary').textContent === '1 result', 12000)
  check('stale search cancelled', page.document.querySelectorAll('.search-result').length === 1)
  check('search snippet highlights match', Boolean(page.document.querySelector('.search-result mark')))
  page.document.querySelector('.search-result').click()
  try { await until(() => view.lastLocation?.tocItem?.label?.includes('第 6 章'), 4000) } catch {}
  check('search click navigates', view.lastLocation?.tocItem?.label?.includes('第 6 章'),
    view.lastLocation?.tocItem?.label)

  page.document.getElementById('bookmark-current').click()
  await wait(80)
  const savedState = [...page.__toExtension].reverse()
    .find(message => message.type === 'reader:book-state-save' && message.immediate)
  check('bookmark saved immediately', savedState?.state?.bookmarks?.length === 1)
  check('bookmark listed', page.document.getElementById('bookmarks-count').textContent === '1')

  const beforeJump = view.lastLocation?.fraction
  const scrubber = page.document.getElementById('progress-scrubber')
  scrubber.value = '72'
  scrubber.dispatchEvent(new page.Event('input', { bubbles: true }))
  scrubber.dispatchEvent(new page.Event('change', { bubbles: true }))
  await wait(500)
  check('progress scrubber jumps', Math.abs(view.lastLocation.fraction - 0.72) < 0.08,
    `${beforeJump} -> ${view.lastLocation.fraction}`)
  check('history records progress jump', view.history.canGoBack)
  const jumped = view.lastLocation.cfi
  page.document.getElementById('history-back').click()
  try { await until(() => view.lastLocation.cfi !== jumped, 3000) } catch {}
  check('history back navigates', view.lastLocation.cfi !== jumped)

  const failed = checks.filter(item => !item.pass)
  result.dataset.done = 'true'
  result.textContent = JSON.stringify({ passed: checks.length - failed.length, failed: failed.length, checks }, null, 2)
  document.documentElement.dataset.done = failed.length ? 'failed' : 'passed'
}

run().catch(error => {
  result.dataset.done = 'true'
  result.textContent = JSON.stringify({ passed: 0, failed: 1, error: String(error?.stack ?? error), checks }, null, 2)
  document.documentElement.dataset.done = 'failed'
})
</script>
</body>
</html>
